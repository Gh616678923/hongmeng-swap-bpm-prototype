<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太力商城 · 鸿蒙换机原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","微软雅黑",-apple-system,sans-serif; background:#f0f2f5; color:#333; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { max-width:860px; width:100%; }
  .hd { text-align:center; margin-bottom:28px; }
  .hd h1 { font-size:24px; color:#FA1708; letter-spacing:1px; }
  .hd p { color:#888; font-size:13px; margin-top:8px; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .card { background:#fff; border-radius:10px; border:1px solid #e5e5e5; box-shadow:0 4px 18px rgba(0,0,0,.06); padding:26px 22px; text-decoration:none; color:#333; transition:all .18s; display:block; }
  .card:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(0,0,0,.12); border-color:#FA1708; }
  .tag { display:inline-block; font-size:11px; color:#fff; background:#FA1708; border-radius:10px; padding:2px 10px; margin-bottom:12px; }
  .card.bpm .tag { background:#3e83c8; }
  .card h2 { font-size:17px; margin-bottom:8px; }
  .card p { font-size:12px; color:#888; line-height:22px; }
  .card .go { margin-top:14px; font-size:13px; color:#FA1708; font-weight:bold; }
  .card.bpm .go { color:#3e83c8; }
  .ft { text-align:center; color:#aaa; font-size:12px; margin-top:26px; }
  @media (max-width:640px){ .cards{grid-template-columns:1fr;} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hd">
      <h1>太力商城 · 鸿蒙换机原型</h1>
      <p>需求方案演示原型（演示数据，非真实业务数据）</p>
    </div>
    <div class="cards">
      <a class="card mall" href="./mall/">
        <span class="tag">商城端</span>
        <h2>商城鸿蒙换机</h2>
        <p>换机单创建/编辑/查看、旧机入库明细、新机出库明细、六面照上传、OCR识别、地址维护等。</p>
        <div class="go">进入商城端原型 →</div>
      </a>
      <a class="card bpm" href="./bpm/">
        <span class="tag">BPM端</span>
        <h2>鸿蒙换机 BPM 审批</h2>
        <p>审核流程单、旧机/异色异型明细、舆情风险标记、审批轨迹、同意/驳回操作。</p>
        <div class="go">进入审批原型 →</div>
      </a>
    </div>
    <div class="ft">中国电子 · 太力商城 ｜ 鸿蒙换机需求详细设计 V1.0</div>
  </div>
</body>
</html>
